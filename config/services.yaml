parameters:
    app.timezone: '%env(APP_TIMEZONE)%'
    # Import logs and export files (v5: the installation's logs/ directory).
    app.instance_log_dir: '%kernel.instance_dir%/logs'
    app.log_dir: '%env(default:app.instance_log_dir:APP_LOG_DIR)%'

    # Defaults for optional instance .env settings.
    env(APP_TIMEZONE): 'Africa/Johannesburg'
    env(APP_ADMIN_EMAIL): ''
    env(AUTH_SESSION_COOKIE): 'ctnlist_session'
    env(SUPPRESSION_PROVIDER): 'banlist'
    env(GDB_ENV_DIRECTORY): ''
    env(GDB_ENV_FILE): ''
    env(TRUSTED_PROXIES): '127.0.0.1'
    env(PHP_SESSION_COOKIE): 'ctnlist_php_session'
    env(MAILER_DSN): 'null://null'
    env(DB_HOST): '127.0.0.1'
    env(DB_PORT): '5432'
    env(DB_SSLMODE): 'prefer'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # Value objects and exceptions, not services.
            - '../src/Security/SubscriberUser.php'
            - '../src/**/*NotFound.php'
            - '../src/Mail/SmtpServer.php'
            - '../src/Campaign/RenderedMessage.php'
            - '../src/Queue/QueueOutcome.php'
            - '../src/Http/Pagination.php'
            - '../src/CattoMail/OutgoingMessage.php'
            - '../src/CattoMail/OutgoingRecipient.php'
            - '../src/CattoMail/SendOutcome.php'
            - '../src/CattoMail/CattoMail{Exception,Unavailable,Rejected}.php'
            - '../src/Config/SettingsCipherException.php'
            - '../src/Subscriber/ProfileImage.php'
            - '../src/Queue/QueueRowClaimed.php'
            # Validation constraints and the data objects Symfony forms edit.
            - '../src/Validator/'
            - '../src/Form/Model/'

    App\Config\SiteConfig:
        factory: '@App\Config\SiteConfigFactory'

    # Lazy: stored SMTP secrets are decrypted only when mail is actually sent.
    App\Mail\SmtpServerPool:
        factory: '@App\Mail\SmtpServerPoolFactory'
        lazy: true

    # One open transport per transactional message (TransactionalMailer); never shared.
    App\Mail\MailConnection:
        shared: false

    App\CattoMail\CattoMailConfig:
        factory: '@App\CattoMail\CattoMailConfigFactory'

    App\Suppression\SuppressionChecker:
        factory: ['@App\Suppression\SuppressionCheckerFactory', 'create']

    # Site error templates for client errors even in debug mode (App\Twig\ErrorPageDebug).
    twig.error_renderer.html:
        class: Symfony\Bridge\Twig\ErrorRenderer\TwigErrorRenderer
        decorates: error_renderer.html
        arguments: ['@twig', '@twig.error_renderer.html.inner', '@App\Twig\ErrorPageDebug']

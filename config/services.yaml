parameters:
    app.timezone: '%env(APP_TIMEZONE)%'

    # Defaults for optional instance .env settings.
    env(APP_TIMEZONE): 'Africa/Johannesburg'
    env(APP_ADMIN_EMAIL): ''
    env(AUTH_SESSION_COOKIE): 'ctnlist_session'
    env(AUTH_SESSION_TTL): '86400'
    env(SUPPRESSION_PROVIDER): 'banlist'
    env(GDB_ENV_DIRECTORY): ''
    env(GDB_ENV_FILE): ''
    env(MAIL_BATCH_SIZE): '600'
    env(MAIL_BATCH_DELAY): '0'
    env(TRUSTED_PROXIES): '127.0.0.1'
    env(PHP_SESSION_COOKIE): 'ctnlist_php_session'
    env(MAILER_DSN): 'null://null'
    env(DB_HOST): '127.0.0.1'
    env(DB_PORT): '5432'
    env(DB_SSLMODE): 'prefer'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Legacy/'
            # Value objects and exceptions, not services.
            - '../src/Security/SubscriberUser.php'
            - '../src/**/*NotFound.php'
            - '../src/Mail/SmtpServer.php'
            - '../src/Mail/CampaignDelivery.php'

    App\Config\SiteConfig:
        factory: '@App\Config\SiteConfigFactory'

    # One open transport per use (queue run, single send); never shared.
    App\Mail\MailConnection:
        shared: false

    App\Suppression\SuppressionChecker:
        factory: ['@App\Suppression\SuppressionCheckerFactory', 'create']

    # ------------------------------------------------------------------
    # Legacy Fat-Free objects, wired by the container until each area is
    # ported. Mappers (*M) and helpers are still created by the legacy code.
    # ------------------------------------------------------------------
    App\Legacy\:
        resource: '../src/Legacy/'
        exclude:
            - '../src/Legacy/routes.php'
            - '../src/Legacy/*M.php'
            - '../src/Legacy/{Controller,Csrf,UuidV7,LegacyRedirect,LegacyHttpError}.php'
            - '../src/Legacy/{formfield,htmlhelper,customers}.php'
            - '../src/Legacy/Global*.php'

    Base:
        class: Base
        factory: ['@App\Legacy\LegacyFramework', 'create']

    DB\SQL:
        class: DB\SQL
        factory: ['@Base', 'get']
        arguments: ['dbPDO']

    App\Legacy\UsersController:
        calls:
            - [SetMailer, ['@App\Legacy\mailer']]

    App\Legacy\SubscribersController:
        calls:
            - [SetMailer, ['@App\Legacy\mailer']]

    App\Legacy\MessagesController:
        calls:
            - [SetTemplate, ['@App\Legacy\TemplatesController']]
            - [SetQueue, ['@App\Legacy\QueueController']]
            - [SetArchive, ['@App\Legacy\ArchivesController']]
            - [SetMailer, ['@App\Legacy\mailer']]

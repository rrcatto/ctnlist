framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    # Comma-separated proxy addresses whose X-Forwarded-For/-Proto are trusted
    # (client IP, HTTPS detection for secure cookies).
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    session:
        handler_id: App\Session\DatabaseSessionHandler
        name: '%env(PHP_SESSION_COOKIE)%'
        cookie_lifetime: 0
        cookie_path: /
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        # PHP's own garbage collection is off, so no php.ini (FPM or CLI)
        # decides how long a session lives: ctnlist:maintenance removes PHP
        # sessions idle longer than a sign-in or sign-in link lasts (Maintenance).
        gc_probability: 0

    # Session-stored CSRF tokens (id App\Security\Csrf::TOKEN_ID, field csrf).
    csrf_protection: true
    # Symfony forms use the same token and field as the manual POST forms
    # (csrf_token('ctnlist') in a field named csrf): one CSRF scheme.
    form:
        csrf_protection:
            token_id: ctnlist
            field_name: csrf

    mailer:
        dsn: '%env(MAILER_DSN)%'

    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

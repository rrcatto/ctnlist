security:
    providers:
        subscribers:
            id: App\Security\SubscriberUserProvider

    firewalls:
        # Authentication state lives in the auth cookie / auth_sessions table,
        # not the PHP session, so the firewall re-authenticates every request.
        main:
            stateless: true
            provider: subscribers
            entry_point: App\Security\AccessDeniedEntryPoint
            custom_authenticators:
                - App\Security\MagicLinkAuthenticator
                - App\Security\AuthSessionAuthenticator
            # POST with the shared CSRF token (field csrf, id ctnlist): a link
            # or image elsewhere cannot sign anyone out.
            logout:
                path: app_logout
                target: /
                enable_csrf: true
                csrf_parameter: csrf
                csrf_token_id: ctnlist

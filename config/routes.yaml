controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Handled by the security firewall (logout listener, MagicLinkAuthenticator);
# these routes never reach a controller.
app_logout:
    path: /logout
    methods: [POST]

# The sign-in itself; opening the emailed link (GET, AuthController::verify)
# only shows the page with its Sign in button.
auth_verify_submit:
    path: /auth/verify
    methods: [POST]


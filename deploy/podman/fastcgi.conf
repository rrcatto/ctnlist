# FastCGI to PHP-FPM in the same pod, copied into the pod by ctnlist-podman.sh and included by the locations of web.conf.in (deploy/podman/README.md). It is
# deploy/nginx/ctnlist-fastcgi.conf.example for a pod.

fastcgi_pass 127.0.0.1:9000;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT $realpath_root;

# The request as the visitor made it, not as it reached this container: HTTPS when the server's web server answered
# on https, and its port, never the pod's 8080 (the mail service's Connect page is given an absolute callback URL).
fastcgi_param HTTPS $ctnlist_https if_not_empty;
fastcgi_param SERVER_PORT $ctnlist_port;

# This server is the edge for PHP: PHP sees the visitor's address as REMOTE_ADDR (set_real_ip_from in web.conf.in)
# and HTTPS from the lines above, so the application needs no proxy trust (TRUSTED_PROXIES empty). Forwarding
# headers are dropped rather than passed on.
fastcgi_param HTTP_X_FORWARDED_FOR "";
fastcgi_param HTTP_X_FORWARDED_PROTO "";
fastcgi_param HTTP_X_FORWARDED_PORT "";
fastcgi_param HTTP_X_FORWARDED_HOST "";

# Queue processing and imports can take minutes (the server's web server waits as long: host-nginx.conf.example).
fastcgi_read_timeout 300s;

<div style="background-color:#ffffff;padding:24px 12px;font-family:Georgia,'Times New Roman',serif;color:#1a1a1a;">
  <div style="max-width:560px;margin:0 auto;">
    <p style="margin:0 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#a33a2b;">Announcement · {listname}</p>
    <div style="border-top:3px solid #a33a2b;border-bottom:1px solid #cccccc;padding:20px 0;font-size:17px;line-height:1.6;">
      {content}
    </div>
    <p style="margin:16px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;">Was this useful to you? {like} &nbsp;/&nbsp; {dislike}</p>
    <p style="margin:8px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;">Questions or a reply? Use the {contact}.</p>
    <p style="margin:20px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#666666;">{organisation} · {domain}<br>{subscription}<br>To stop receiving {listname}: {unsubscribe}</p>
  </div>
  {usertrack}
</div>

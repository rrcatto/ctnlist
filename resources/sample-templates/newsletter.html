<div style="background-color:#f3f4f1;padding:24px 12px;font-family:Arial,Helvetica,sans-serif;color:#222222;">
  <div style="max-width:600px;margin:0 auto;background-color:#ffffff;border:1px solid #d9dbd4;">
    <div style="background-color:#1f4e79;color:#ffffff;padding:22px 24px;">
      <p style="margin:0;font-size:24px;font-weight:bold;line-height:1.2;">{listname}</p>
      <p style="margin:6px 0 0;font-size:13px;line-height:1.4;">{organisation}</p>
    </div>
    <div style="padding:24px;font-size:16px;line-height:1.55;">
      <p style="margin:0 0 16px;">Dear {firstname},</p>
      {content}
    </div>
    <div style="padding:16px 24px;background-color:#f8f9f6;border-top:1px solid #d9dbd4;font-size:13px;line-height:1.5;color:#555555;">
      <p style="margin:0 0 8px;">Know someone who would like to read this? {forward}</p>
      <p style="margin:0 0 8px;">{subscription}</p>
      <p style="margin:0 0 8px;">You are receiving this because you subscribed to {listname}. To stop: {unsubscribe}</p>
      <p style="margin:0;">{facebook} {twitter}</p>
    </div>
  </div>
  {usertrack}
</div>

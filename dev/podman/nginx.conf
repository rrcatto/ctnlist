# Port the browser used (8180 on the host), taken from the Host header. F3
# builds absolute redirect URLs from SERVER_NAME and SERVER_PORT, which would
# otherwise be the container's own port 80.
map $http_host $client_port {
    ~:(?<p>[0-9]+)$ $p;
    default         80;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/ctnlist/public_html;
    index index.php;
    client_max_body_size 32m;

    # Static assets (public_html/css, public_html/js) are served directly;
    # everything else goes to the front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        # Path inside the PHP-FPM container.
        fastcgi_param SCRIPT_FILENAME /var/www/ctnlist/public_html/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/ctnlist/public_html;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $client_port;
        fastcgi_read_timeout 300s;
    }

    # Any other PHP file path is not a valid entry point.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}

# Port the browser used (8180 on the host), taken from the Host header, so
# PHP's SERVER_PORT matches the URL the browser sees rather than the
# container's own port 80.
map $http_host $client_port {
    ~:(?<p>[0-9]+)$ $p;
    default         80;
}

server {
    listen 80;
    # HTTPS with a generated self-signed development certificate (bin/dev),
    # for an https APP_BASE_URL: catto-mail only accepts https unsubscribe
    # links. Host port 8543; see README "catto-mail development route".
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/ctnlist-dev.crt;
    ssl_certificate_key /etc/nginx/tls/ctnlist-dev.key;
    server_name localhost ctnlist-web;

    root /var/www/ctnlist/public_html;
    index index.php;
    client_max_body_size 32m;

    # Existing files (public_html/vendor, compiled public_html/assets) are served
    # directly; everything else goes to the front controller, which in debug
    # mode also serves /assets/* through AssetMapper.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        # Path inside the PHP-FPM container.
        fastcgi_param SCRIPT_FILENAME /var/www/ctnlist/public_html/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/ctnlist/public_html;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $client_port;
        fastcgi_read_timeout 300s;
    }

    # Any other PHP file path is not a valid entry point.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
